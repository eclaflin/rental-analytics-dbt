version: 2

models:
  - name: int_calendar__deduped
    description: >
      One row per listing per date. Deduplicates known source duplicates at the
      listing_id + date grain, preserving all rows including available and
      blocked-but-unreserved days. Serves as the spine for the mart.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - listing_id
              - listing_date
    columns:
      - name: listing_id
        description: Foreign key to stg_raw__listings.
        data_tests:
          - not_null

      - name: listing_date
        description: Calendar date this row describes.
        data_tests:
          - not_null

      - name: available
        description: Whether the listing was available for booking on this date.
        data_tests:
          - not_null

      - name: price
        description: The USD price to rent this listing on this date.
        data_tests:
          - not_null

      - name: reservation_id
        description: Reservation occupying this date, if any. Null if the date was available or blocked without a reservation.

      - name: minimum_nights
        description: Minimum number of nights that must be booked consecutively for this listing.
        data_tests:
          - not_null

      - name: maximum_nights
        description: Maximum number of nights that may be booked consecutively for this listing.
        data_tests:
          - not_null

  - name: int_amenities__effective_ranges
    description: >
      One row per amenity state change per listing. Converts the amenities changelog
      into SCD2-style date ranges, capturing which amenities were active for a given
      listing between effective_from and effective_to. A null effective_to indicates
      the current active record. Intra-day changes are resolved by taking the latest
      change within a given day.
    data_tests:
      # scd2 testing: grain must be unique (no duplicate effective_from per listing),
      # and all ranges must have start < end.
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - listing_id
              - effective_from
      - dbt_utils.expression_is_true:
          arguments:
            expression: "effective_from < effective_to"
          where: "effective_to is not null"
    columns:
      - name: listing_id
        description: Foreign key to stg_raw__listings.
        data_tests:
          - not_null

      - name: amenities
        description: JSON array of amenities active for this listing during this effective window.
        data_tests:
          - not_null

      - name: effective_from
        description: Date from which this amenity state became active, inclusive.
        data_tests:
          - not_null

      - name: effective_to
        description: Date on which this amenity state was superseded, exclusive. Null indicates the current active record.
