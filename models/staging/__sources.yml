version: 2

sources:
  - name: raw
    schema: raw
    description: >
      Raw source tables loaded from CSV into Postgres on container init
      (see docker/initdb/). Columns are untyped (TEXT) at this layer;
      casting and cleanup happen in staging models.
    tables:
      - name: listings
        description: >
          One row per rental listing. Known data quality issue: a small
          number of rows have a null `id`. 
          
        # NOTE: There's an argument for adding a test at the source layer to catch null listing_ids,
        # using `warn` severity so the upstream data-quality issue is visible and monitored without
        # failing the job outright. In practice, at enterprise scale, I've found this pattern tends to
        # balloon into a volume of warn messages that analytics engineers train themselves to ignore
        # over time, since the issue is outside their control. It's an example of where a documented
        # best practice doesn't necessarily drive a better outcome: it adds alerting fatigue
        # without a clear path to act on it. Debatable either way. Handling will instead be made explicit
        # downstream in stg_listings.sql.

      - name: calendar
        description: "One row per listing per date.  Known data quality issue: a small
        number of duplicate records at the grain of `listing_id` and `date`"

      - name: amenities_changelog
        description: "One row per amenity-list change event for a listing."