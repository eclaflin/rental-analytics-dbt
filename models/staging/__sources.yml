version: 2

sources:
  - name: raw
    schema: raw
    description: >
      Raw source tables loaded from CSV into Postgres on container init
      (see docker/initdb/). Columns are untyped (TEXT) at this layer;
      casting and cleanup happen in staging models.
    tables:
      - name: listings
        description: >
          One row per rental listing. Known data quality issue: a small
          number of rows have a null `id`. 

        columns:
          - name: id
            # A not_null test with warn severity is applied here to surface this upstream data quality
            # issue without failing the run. Rows with null ids are explicitly filtered in stg_raw__listings.sql,
            # keeping the handling decision in one place rather than propagating nulls downstream.
            data_tests:
              - not_null:
                  config:
                    severity: warn

      - name: calendar
        description: "One row per listing per date.  Known data quality issue: a small
        number of duplicate records at the grain of `listing_id` and `date`"

      - name: amenities_changelog
        description: "One row per amenity-list change event for a listing."